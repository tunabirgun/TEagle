[pytest]
testpaths = tests
markers =
    network: requires internet (NCBI E-utilities); run with -m network, skipped by default set
    wsl: requires the WSL2 RepeatMasker+Dfam backend; run with -m wsl
# The default run is HERMETIC, which is what the README and CLAUDE.md have always claimed. Without
# this deselection the documented command ran ten WSL annotations and dozens of NCBI fetches, took
# over 90 minutes, and failed outright on a machine with no network or no backend.
# Run the gated sets explicitly:  pytest -m wsl   |   pytest -m network
# A command-line -m overrides this one, so those still work.
addopts = -q --strict-markers -m "not wsl and not network"
